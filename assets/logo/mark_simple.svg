<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Followthrough mark (favicon)">
  <!--
    Followthrough mark — Simplified (favicon / small)
    No endpoint dot (it disappears below 32px). Heavier stroke for visibility.
    Use at 16px–48px (favicons, tiny social avatars).
  -->
  <circle cx="50" cy="50" r="34"
          fill="none"
          stroke="currentColor"
          stroke-width="14"
          stroke-linecap="round"
          stroke-dasharray="186 214"
          transform="rotate(-90 50 50)"/>
</svg>
