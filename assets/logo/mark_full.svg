<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Followthrough mark">
  <!--
    Followthrough mark — Full (default)
    Open arc closing on itself + rust endpoint dot.
    Use at 64px and above. Below 64px, switch to mark_simple.svg.
    Foreground stroke = currentColor so it inherits text color.
  -->
  <circle cx="50" cy="50" r="38"
          fill="none"
          stroke="currentColor"
          stroke-width="6"
          stroke-linecap="round"
          stroke-dasharray="209 239"
          transform="rotate(-90 50 50)"/>
  <circle cx="50" cy="12" r="5" fill="#B85A1A"/>
</svg>
